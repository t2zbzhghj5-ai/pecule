<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pécule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pécule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Pécule, maquette R « enveloppes de couleur » : fond blanc, chaque poche d'argent a sa couleur pastel, police Outfit, pas d'ombre */
  --bg:#FFFFFF; --surface:#FFFFFF; --card:#F5F5F8; --surface2:#EDEDF2; --ink:#1D2033; --muted:#6B7088; --line:#E7E7EE;
  --accent:#1D2033; --onacc:#FFFFFF; --accent2:#11643E; --hero:#4E33B8; --hero2:#6B4FD6; --hero-ink:#2A2000; --hero-muted:#5A4500; --sun:#FFD25E;
  --pos:#11643E; --neg:#A51F45; --warn:#9C4313; --low:#B4461A; --shadow:none; --bmix:100%; --track:rgba(255,255,255,.7);
  --p-butter:#FFF0B3; --pi-butter:#5A4500; --pn-butter:#2A2000; --p-sky:#DCEAFF; --pi-sky:#1B4FA8; --p-lilac:#E9E2FD; --pi-lilac:#4E33B8;
  --p-peach:#FFE3D2; --pi-peach:#9C4313; --p-mint:#D6F2E4; --pi-mint:#11643E; --p-rose:#FFDDE4; --pi-rose:#A51F45; --pv-bar:#F0D56A; --pv-neg:#D9415F;
  --display:"Outfit",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:"Outfit",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:22px; --aov:rgba(255,255,255,.75); --aov2:rgba(255,255,255,.6);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141D; --surface:#191A26; --card:#1E2030; --surface2:#262839; --ink:#F2F3F8; --muted:#A3A7BD; --line:#2A2C3E;
    --accent:#F2F3F8; --onacc:#13141D; --accent2:#8FDDB6; --hero:#2A2346; --hero2:#3A2F66; --hero-ink:#FFF1C2; --hero-muted:#FFDF7A; --sun:#FFD25E;
    --pos:#8FDDB6; --neg:#FF9FB5; --warn:#FFB98F; --low:#FFB98F; --shadow:none; --bmix:100%; --track:rgba(255,255,255,.14); --segon:#2E3044;
    --p-butter:#3A3115; --pi-butter:#FFDF7A; --pn-butter:#FFF1C2; --p-sky:#1B2A44; --pi-sky:#9EC2FF; --p-lilac:#2A2346; --pi-lilac:#C4B3FF;
    --p-peach:#3C2517; --pi-peach:#FFB98F; --p-mint:#163427; --pi-mint:#8FDDB6; --p-rose:#3E1C26; --pi-rose:#FF9FB5; --pv-bar:#6E5C24; --pv-neg:#FF7A98; --aov:rgba(255,255,255,.08); --aov2:rgba(255,255,255,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13141D; --surface:#191A26; --card:#1E2030; --surface2:#262839; --ink:#F2F3F8; --muted:#A3A7BD; --line:#2A2C3E;
  --accent:#F2F3F8; --onacc:#13141D; --accent2:#8FDDB6; --hero:#2A2346; --hero2:#3A2F66; --hero-ink:#FFF1C2; --hero-muted:#FFDF7A; --sun:#FFD25E;
  --pos:#8FDDB6; --neg:#FF9FB5; --warn:#FFB98F; --low:#FFB98F; --shadow:none; --bmix:100%; --track:rgba(255,255,255,.14); --segon:#2E3044;
  --p-butter:#3A3115; --pi-butter:#FFDF7A; --pn-butter:#FFF1C2; --p-sky:#1B2A44; --pi-sky:#9EC2FF; --p-lilac:#2A2346; --pi-lilac:#C4B3FF;
  --p-peach:#3C2517; --pi-peach:#FFB98F; --p-mint:#163427; --pi-mint:#8FDDB6; --p-rose:#3E1C26; --pi-rose:#FF9FB5; --pv-bar:#6E5C24; --pv-neg:#FF7A98; --aov:rgba(255,255,255,.08); --aov2:rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
/* La page elle-même ne défile jamais (bogue d'iOS 26 : les barres fixées en bas se décalent quand la page défile) : c'est #app qui défile.
   #app reste dans le flux (pas en position fixe) : sinon, sur iPhone, il passait un peu sous la barre d'état. */
#app{height:calc(100% - var(--vvb, 0px));overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 16px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.top .ttl{flex:1;min-width:0}
.top .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.dot.off{background:var(--warn)}
.ibtn{width:40px;height:40px;border-radius:20px;border:0;background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn.plain{background:none;box-shadow:none}
.ibtn:disabled{opacity:.28}
.scr{padding:4px 16px calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px;gap:8px}
.sec-h h2{font-family:var(--body);font-size:18px;margin:0;letter-spacing:-.01em;font-weight:600;color:var(--ink)}
.accseg{display:grid;gap:4px;padding:4px;background:color-mix(in srgb,var(--ink) 7%,var(--bg));border-radius:14px}
.accseg button{height:40px;border:0;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.accseg button.on{background:var(--segon,var(--surface));color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip-s{min-width:44px;height:36px;border-radius:18px;font-size:14px;font-weight:600;padding:0 14px;border:0;background:var(--card);color:var(--ink)}
.chip-s.on{background:var(--accent);color:var(--onacc)}
.brow{padding:12px 0;display:flex;flex-direction:column;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit}
.brow:last-child{border-bottom:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:15px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;font:inherit;min-height:60px}
.card>.row:first-child,.card>div>.row:first-child{border-top:0}
button.row:active{background:var(--surface2)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.ic.sm{width:30px;height:30px;border-radius:50%;font-size:15px}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.amt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .bad{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hero{background:var(--p-butter);color:var(--pn-butter);border-radius:28px;padding:20px 22px 18px;position:relative;overflow:hidden}
.hero .lbl{font-size:13.5px;color:var(--hero-muted);font-weight:600;display:flex;align-items:center;gap:8px;position:relative}
.hero .cap{font-size:13px;color:var(--hero-muted);margin-top:12px;font-weight:600;position:relative}
.hero .big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:4px 0 4px;font-variant-numeric:tabular-nums;position:relative}
.hero .hint{font-size:13.5px;color:var(--hero-muted);max-width:40ch;position:relative}
.hero .chart text{fill:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;position:relative}
.brk .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hero .chart{margin-top:10px;position:relative}
.card.pad{padding:16px}
.qas{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:12.5px;font-weight:600;color:var(--ink);padding:4px 0}
.qa-i{width:50px;height:50px;border-radius:16px;background:var(--card);display:grid;place-items:center;color:var(--accent);font-size:20px}
.datebox{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;line-height:1.05;flex:none;text-transform:uppercase}
.datebox b{font-size:16px;color:var(--ink)}
.hbar{background:none;border:0;padding:0;text-align:left;width:100%;color:inherit}
.tile .d{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.tile .d.bad{color:var(--neg)} .tile .d.pos{color:var(--pos)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.acard{flex:none;width:200px;scroll-snap-align:start;border:0;text-align:left;border-radius:20px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.acard .n{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.acard .b{font-size:21px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acard .s{font-size:12px;color:var(--muted)}
.greet{font-size:14px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:20px;padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.tabbar{position:fixed;bottom:var(--vvb, 0px);left:0;right:0;z-index:6;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 97%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;max-width:480px;width:100%}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:none;border:0;padding:6px 0 4px;font-weight:600;white-space:nowrap;min-width:0;min-height:50px;justify-content:center}
.tab.on{color:var(--ink);font-weight:700}
.tab.on svg{stroke-width:2.2;background:var(--p-butter);border-radius:15px;padding:4px 16px;box-sizing:content-box;margin:-4px 0}
.tab-plus{display:flex;justify-content:center}
.tab-plus button:not(.bub){width:56px;height:56px;margin-top:-24px;border-radius:28px;border:4px solid var(--surface);background:var(--accent);color:var(--onacc);display:flex;align-items:center;justify-content:center}
.wiz{position:fixed;inset:0 0 var(--vvb, 0px) 0;z-index:20;background:var(--surface);display:flex;justify-content:center;animation:fade .15s ease}
.wiz-in{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.wiz-q{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1.15}
.wiz-k{font-size:13px;color:var(--muted);font-weight:500}
.wtile{text-align:left;height:112px;border-radius:20px;border:1px solid var(--line);background:var(--bg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.wtile .wi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.wbig{min-height:56px;border-radius:16px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;display:flex;align-items:center;gap:8px;text-align:left}
.wbig.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--accent)}
.wkey{height:52px;border:0;border-radius:14px;background:transparent;font-size:26px;font-weight:500;color:var(--ink)}
.wkey:active{background:var(--line)}
.wgo{width:100%;min-height:56px;flex:none;border:0;border-radius:16px;font-size:16px;font-weight:600;background:var(--accent);color:var(--surface)}
.wgo:disabled{background:var(--line);color:var(--muted)}
.wsw{width:50px;height:30px;border-radius:15px;padding:3px;display:flex;background:color-mix(in srgb,var(--ink) 18%,transparent);flex:none}
.wsw.on{justify-content:flex-end;background:var(--accent)}
.wsw i{width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.dcirc{width:44px;height:44px;border-radius:22px;background:color-mix(in srgb,var(--ink) 6%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dcirc b{font-size:16px;line-height:1}.dcirc span{font-size:10px;color:var(--muted);margin-top:2px}
.nest{margin:0 0 4px 34px;border-left:2px solid var(--line);padding-left:4px}
.nest .row{min-height:50px}
.dchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.dchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink)}
.bub{width:26px;height:26px;border-radius:13px;border:2px solid var(--surface);background:var(--accent);color:var(--onacc);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0;flex:none;box-shadow:0 2px 6px rgba(15,23,42,.25);vertical-align:middle;animation:fade .2s ease}
.bub.on{background:var(--ink);color:var(--surface)}
.helptip{position:fixed;left:12px;right:12px;bottom:calc(100px + env(safe-area-inset-bottom) + var(--vvb, 0px));z-index:15;max-width:456px;margin:0 auto;background:#0F172A;color:#fff;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(15,23,42,.3)}
.accpill{height:42px;padding:0 14px 0 6px;border-radius:21px;border:0;background:var(--card);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink);min-width:0;max-width:100%}
.accpill .ini{width:30px;height:30px;border-radius:15px;background:var(--p-butter);color:var(--pi-butter);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.tile{background:var(--card);border-radius:20px;padding:12px 14px;text-align:left}
.tile .l{font-size:12px;color:var(--muted)}.tile .v{font-size:16px;font-weight:600;margin-top:2px}
.bpill{flex:none;width:150px;text-align:left;background:var(--pb,var(--card));border:0;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.dcol{width:40px;text-align:center;flex:none}.dcol b{display:block;font-size:17px;line-height:1}.dcol span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.fgh{font-size:13px;font-weight:600;color:var(--muted);padding:0 6px 6px}
.hbtn{width:44px;height:44px;border-radius:22px;border:0;display:grid;place-items:center;flex:none;background:var(--card);color:var(--ink)}
.hbtn.pri{background:var(--accent);color:var(--onacc)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom) + var(--vvb, 0px));z-index:7;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onacc);border:0;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 42%,transparent);display:grid;place-items:center}
.sheet-back{position:fixed;inset:0 0 var(--vvb, 0px) 0;z-index:20;background:rgba(9,13,24,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 20px);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--line);gap:8px}
.sheet-h strong{font-family:var(--display);font-size:16px;font-weight:800;text-align:center}
.sheet-h .r{justify-self:end}
.sheet-h .l{justify-self:start}
.sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.help{font-size:12.5px;color:var(--muted);margin:0 2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:70px;resize:vertical}
/* iPhone : un champ écrit en dessous de 16 px fait zoomer Safari quand on le touche, et la page reste agrandie (barre du bas coupée) */
@media (hover: none) and (pointer: coarse){input:not(.amount-in):not(.big-in),select,textarea{font-size:16px !important}} /* les grands champs (montants, code) restent grands */
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]:disabled{opacity:.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.amount-in{font-family:var(--display);font-size:40px;font-weight:800;text-align:center;border:0;background:none;box-shadow:none!important;padding:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}

/* Grand écran (Mac, iPad à l'horizontale) : menu latéral, contenu plus large, fenêtres centrées */

  .tab.on{background:var(--p-butter);color:var(--pi-butter)}

  .tab-plus{order:-1;margin-bottom:12px}

  .plus-l{display:inline}
  .side-brand{order:-2}
  .sheet-back{align-items:center;padding:24px}
  .sheet{max-width:620px;max-height:88vh;border-radius:24px;animation:fade .18s ease}
  .wiz{background:rgba(9,13,24,.45);align-items:center;padding:24px}

  .toasts{left:var(--side);bottom:40px}

  .hscroll,.carousel{margin:0;padding-left:0;padding-right:0}
  .dash{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}

  .dash-l .bpill{width:calc(50% - 5px)}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

  const dateOf = k => { const [y, m] = k.split("-").map(Number); return `${k}-${pad(Math.min(day, dim(y, m)))}`; };
  const first = (() => { let k = p.since && p.since > ym(today()) ? p.since : ym(today()); if (dateOf(k) < today() && !(p.since && p.since > ym(today()))) k = ymAdd(k, 1); return dateOf(k); })();
  for (const who of ["me", "her"]) {

    const acc = who === "me" ? p.from : j, nm = who === "me" ? "Virement au " + accName(j) + " (prorata)" : name + " (prorata)";
    const val = k => { const x = prMonth(k); return who === "me" ? -x.mine : x.hers; };

    const want = {...(cur || {}), k: "sch", id, prAuto: who, account: acc, name: nm, amount: base, splits: mk(base), freq: {n: 1, u: "m"}, next, anchor: day, end: null, left: null, auto: false, paused: false, pay: "virement", payee: null, ov, comment: "Calculé par Pécule : partage au prorata des salaires"};
    if (!cur || JSON.stringify({...cur, v: undefined}) !== JSON.stringify({...want, v: undefined})) ops.push(["put", want]);

function calc(str) {
  const s = String(str ?? "").replace(/\s|€| /g, "").replace(/,/g, ".").replace(/−/g, "-").replace(/×/g, "*");
  if (!s) return NaN;
  let i = 0;
  const num = () => { const j = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; if (j === i) throw 0; return parseFloat(s.slice(j, i)); };
  const factor = () => { if (s[i] === "-") { i++; return -factor(); } if (s[i] === "+") { i++; return factor(); } if (s[i] === "(") { i++; const v = expr(); if (s[i++] !== ")") throw 0; return v; } return num(); };
  const term = () => { let v = factor(); while (s[i] === "*" || s[i] === "/") { const o = s[i++]; const w = factor(); v = o === "*" ? v*w : v/w; } return v; };
  const expr = () => { let v = term(); while (s[i] === "+" || s[i] === "-") { const o = s[i++]; const w = term(); v = o === "+" ? v+w : v-w; } return v; };
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return r2(v); } catch { return NaN; }
}

/* ============ Filet de sécurité des données (v79) ============

   - des données présentes mais illisibles au démarrage ne sont jamais remplacées (Store.bad → écran « Récupérer mes données », copie dans pecule-secours) ;
   - une copie à part (hors de pecule-local) juste avant chaque nouvelle version de l'app (« maj ») et avant chaque grosse opération (« op » :

const nowLocal = () => { const d = new Date(); return iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); };

const copies = () => COPY_SLOTS.map(copyInfo).filter(Boolean).sort((a, b) => b.at.localeCompare(a.at));
const copyDocs = slot => { try { const l = JSON.parse(localStorage.getItem(copyKey(slot)) || "null"); return Array.isArray(l) ? l : null; } catch { return null; } };
function makeCopy(slot, info) {
  const docs = Store.all(); /* sans les copies mensuelles */
  try { localStorage.setItem(copyKey(slot), JSON.stringify(docs)); localStorage.setItem(copyKey(slot) + "-info", JSON.stringify({...info, at: nowLocal(), count: docs.length})); return true; }
  catch (e) { try { localStorage.removeItem(copyKey(slot)); localStorage.removeItem(copyKey(slot) + "-info"); } catch {} console.warn("copie de sécurité impossible", e); return false; }
}
function dropCopies() { let n = 0; for (const s of COPY_SLOTS) { try { if (localStorage.getItem(copyKey(s))) n++; localStorage.removeItem(copyKey(s)); localStorage.removeItem(copyKey(s) + "-info"); } catch {} } return n; }

async function replaceAll(docs) {

}
function Line({pts, splitAt}) {

  const W = 340, H = 190, top = 14, bot = 26, left = 6, right = 6;
  const vals = pts.map(p => p.v), mn0 = Math.min(...vals), mx0 = Math.max(...vals), pad0 = (mx0 - mn0) * .12 || Math.abs(mx0) * .1 || 100;

  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Évolution du solde">
    ${ref(mx0, "max")}${ref(mn0, "min")}${Math.abs(avg - mx0) > (mx - mn) * .1 && Math.abs(avg - mn0) > (mx - mn) * .1 ? ref(avg, "moy.") : ""}
    ${mn < 0 && mx > 0 && html`<line x1=${left} x2=${W - right} y1=${y(0)} y2=${y(0)} stroke="var(--neg)" opacity=".5" />`}

}

/* ============ Coller un texte de la banque ============ */
const MOIS_RE = {janv: 1, jan: 1, fevr: 2, fev: 2, mars: 3, mar: 3, avr: 4, mai: 5, juin: 6, juil: 7, aout: 8, sept: 9, sep: 9, oct: 10, nov: 11, dec: 12};
/* Lecture d'un texte collé ou écrit (« Monoprix 23,40 € hier », notification de banque…).
   Montant : 23,40 / 12,5 / 60.25 / 1 234,5 / 25 € ; sans virgule ni €, le dernier nombre (« Ciné 12 »).
   Libellé : tout le texte autour du montant (« Pain au chocolat »), sans la date ni les formules de la banque. */
const AMT_STRICT = /([+\-−]?\s?(?:\d{1,3}(?:[  .]\d{3})+|\d+)[,.]\d{1,2}(?!\d))\s?(€|eur\b)?|([+\-−]?\s?(?:\d{1,3}(?:[  ]\d{3})+|\d+))\s?(€|eur\b)/gi;

    if (!credit) amount = -amount;
    let date = null, dm = /(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/.exec(b.slice(0, best.idx) + " ".repeat(best.len) + b.slice(best.idx + best.len));
    if (dm && Number(dm[2]) <= 12 && Number(dm[1]) <= 31) { let y = dm[3] ? Number(dm[3]) : Number(t.slice(0, 4)); if (y < 100) y += 2000; date = `${y}-${pad(Number(dm[2]))}-${pad(Number(dm[1]))}`; if (!dm[3] && date > addDays(t, 2)) date = `${y - 1}${date.slice(4)}`; }

        .replace(/\b(montant|euros?|eur)\b|€|[*:•|]/gi, " ");

      /* petits mots laissés seuls à la fin (« le » d'une date, « de »…) ; au début seulement après une formule de banque

}
function PasteSheet({acc, text, close}) {

/* ============ Catégorisation par Claude ============ */
let SAMPLE = null;
const getSample = async () => { if (SAMPLE !== null) return SAMPLE; try { SAMPLE = window.claude?.use ? await window.claude.use("sample") : null; } catch { SAMPLE = null; } return SAMPLE; };

    try {

      const valid = new Set(cats().map(c => c.id));
      const items = (r?.items || []).filter(x => A().tx[x.id] && (x.cat === null || valid.has(x.cat))).map(x => ({...x, on: !!x.cat}));
      const rl = (r?.rules || []).filter(x => x.contains && valid.has(x.cat) && !rulesList().some(y => (y.conds || []).some(c => norm(c.v) === norm(x.contains)))).map(x => ({...x, on: true}));

    let n = rulesList().length;

      <button class="btn pri" disabled=${!txs.length} onClick=${run}>✨ Proposer les catégories</button>`}

    ${st === "done" && html`

/* ============ Pointage d'un relevé ============ */
function Reconcile({id, close}) {
  const a = A().acc[id];
  const [d, setD] = useState(a.lastStatement?.next || today());
  const [bal, setBal] = useState("");
  const [neg, setNeg] = useState(a.type === "carte" || balance(id) < 0);
  const list = (idx()[id] || []).map(([x]) => x).filter(x => x.st !== "annulee" && sideSt(x, id) !== "verrouillee" && x.date <= d).sort((p, q) => p.date.localeCompare(q.date));
  const [sel, setSel] = useState(() => new Set(list.filter(x => sideSt(x, id) === "pointee").map(x => x.id)));
  const base = balance(id, {locked: true});
  const pointed = r2(base + list.filter(x => sel.has(x.id)).reduce((s, x) => s + amtFor(x, id), 0));
  const target = calc(bal), tgt = isNaN(target) ? null : (neg ? -Math.abs(target) : target);
  const diff = tgt == null ? null : r2(tgt - pointed);
  const tog = x => { const n = new Set(sel); n.has(x.id) ? n.delete(x.id) : n.add(x.id); setSel(n); };
  const write = async lock => {
    const ops = [];
    const sid = uid("stm"); let count = 0;
    for (const x of list) { const cur = sideSt(x, id); const want = sel.has(x.id) ? (lock ? "verrouillee" : "pointee") : (cur === "importee" ? "importee" : "saisie");
      if (cur !== want || (lock && sel.has(x.id))) { let y = setSide(x, id, want); if (lock && sel.has(x.id)) { y = x.account === id ? {...y, stmt: sid} : {...y, stmt2: sid}; count++; } ops.push(["put", y]); } }
    if (lock) { const acc = A().acc[id]; ops.push(["put", {...acc, lastStatement: {date: d, bal: tgt, next: addDays(d, 30)}, statements: [...(acc.statements || []), {id: sid, date: d, start: base, end: tgt, count}]}]); }
    close(); await Store.bulk(ops); toast(lock ? "Relevé verrouillé" : "Pointage enregistré");
  };
  return html`<${Sheet} title="Pointer un relevé" close=${close}>
    <div class="grid2">
      <${Field} label="Date du relevé" id="rc-d"><input id="rc-d" type="date" value=${d} onInput=${e => setD(e.target.value)} /></${Field}>
      <${Field} label="Solde du relevé" id="rc-b"><div style="display:flex;gap:6px"><button type="button" class="btn sm" onClick=${() => setNeg(!neg)} aria-label="Changer le signe">${neg ? "−" : "+"}</button><input id="rc-b" inputmode="decimal" value=${bal} onInput=${e => setBal(e.target.value)} placeholder="0,00" /></div></${Field}>
    </div>
    <div class="card" style="padding:12px 14px">
      <div class="kv"><span>Solde de départ${a.statements?.length ? " (relevé du " + dayShort(a.statements[a.statements.length - 1].date) + ")" : ""}</span><span>${fmt(base)}</span></div>
      ${a.statements?.length > 0 && Math.abs((a.statements[a.statements.length - 1].end ?? base) - base) > 0.004 && html`<div class="help" style="color:var(--warn)">Le relevé précédent finissait à ${fmt(a.statements[a.statements.length - 1].end)} : une opération verrouillée a peut-être été modifiée.</div>`}
      <div class="kv"><span>Solde pointé</span><span>${fmt(pointed)}</span></div>
      <div class="kv"><span>Écart avec le relevé</span><span class=${diff == null ? "muted" : Math.abs(diff) < 0.005 ? "pos" : "bad"}>${diff == null ? "—" : Math.abs(diff) < 0.005 ? "0,00 € ✓" : fmt(diff, true)}</span></div>
    </div>
    <div class="help">Coche chaque opération présente sur le relevé. Quand l'écart tombe à zéro, tu peux verrouiller.</div>
    <div class="card">${list.length ? list.map(x => html`<button class="row" onClick=${() => tog(x)}>
      <span class=${"check" + (sel.has(x.id) ? " on" : "")}>${sel.has(x.id) && html`<${Ic} n="check" s=${14} w=${3} />`}</span>
      <span class="grow"><div class="t1">${x.name}</div><div class="t2">${dayLabel(x.date)}</div></span>
      <span class="amt ${amtFor(x, id) > 0 ? "pos" : ""}">${fmt(amtFor(x, id), true)}</span></button>`) : html`<div class="empty">Aucune opération à pointer jusqu'à cette date.</div>`}</div>
    <div class="btns"><button class="btn" onClick=${() => write(false)}>Enregistrer</button><button class="btn pri" disabled=${diff == null || Math.abs(diff) >= 0.005} onClick=${() => write(true)}><${Ic} n="lock" s=${17} />Verrouiller</button></div>
  </${Sheet}>`;
}

/* ============ Import ============ */
function ImportSheet({acc, close}) {
  const [accId, setAcc] = useState(acc || accList()[0]?.id);
  const [rows, setRows] = useState(null);
  const [csv, setCsv] = useState(null);
  const [map, setMap] = useState({});
  const [opts, setOpts] = useState({rules: true, point: true, byName: true});
  const [over, setOver] = useState({});
  const [busy, setBusy] = useState(null);
  const [err, setErr] = useState("");
  const [raw, setRaw] = useState(null);
  const saved = A().acc[accId]?.imp || {};
  const [cfg, setCfg] = useState({enc: saved.enc || "auto", df: saved.df || "auto", skip: saved.skip || 0, header: saved.header !== false});
  const decode = (buf, enc) => { if (enc === "auto") { const t = new TextDecoder("utf-8").decode(buf); return t.includes(String.fromCharCode(0xFFFD)) ? new TextDecoder("windows-1252").decode(buf) : t; } return new TextDecoder(enc).decode(buf); };
  const load = (file, c) => {
    const txt = decode(file.buf, c.enc), n = file.name.toLowerCase();
    if (n.endsWith(".ofx") || n.endsWith(".qfx") || /<OFX>/i.test(txt)) { setRows(parseOFX(txt)); setCsv(null); }
    else if (n.endsWith(".qif") || /^!Type/m.test(txt)) { setRows(parseQIF(txt).map(r => ({...r, date: c.df === "auto" ? r.date : r.date}))); setCsv(null); }
    else { let r = parseCSV(txt).slice(Number(c.skip) || 0); if (r.length < 1) return setErr("Fichier vide ou illisible.");
      if (!c.header) r = [r[0].map((_, i) => "Colonne " + (i + 1)), ...r];
      const h = r[0].map(norm); const fi = re => h.findIndex(x => re.test(x));
      const keep = saved.map && saved.cols === r[0].length ? saved.map : null;
      setMap(keep || {date: Math.max(0, fi(/date/)), name: Math.max(0, fi(/libell|descri|intitul|nom|label/)), amount: fi(/montant|amount|somme/), debit: fi(/debit/), credit: fi(/credit/), memo: fi(/comment|memo|detail/), payee: fi(/tiers|beneficiaire|payee/)}); setCsv(r); setRows(null); }
  };
  const onFile = async e => { setErr(""); const file = e.target.files[0]; if (!file) return; const f2 = {name: file.name, buf: await file.arrayBuffer()}; setRaw(f2); load(f2, cfg); };
  const setC = (k, v) => { const c = {...cfg, [k]: v}; setCfg(c); if (raw) load(raw, c); };
  const fromCsv = () => {
    const out = [];
    for (const r of csv.slice(1)) {

}

    <div class="chips">${COLORS.map(c => html`<button type="button" aria-label=${"Couleur " + c} onClick=${() => set("color", c)} style=${`width:30px;height:30px;border-radius:10px;border:3px solid ${f.color === c ? "var(--ink)" : "transparent"};background:${c}`}></button>`)}</div>
    <${Field} label="Dans" id="ct-p"><select id="ct-p" value=${f.parent || ""} onChange=${e => set("parent", e.target.value || null)}><option value="">Catégorie principale</option>${topCats().filter(c => c.id !== id).map(c => html`<option value=${c.id}>${c.name}</option>`)}</select></${Field}>
    ${!f.parent && html`<${Seg} v=${f.type || "dep"} set=${v => set("type", v)} opts=${[["dep", "Dépenses"], ["rev", "Revenus"], ["both", "Les deux"]]} />`}
    <button class="btn pri" onClick=${save}>Enregistrer</button>
    ${c0 && html`<button class="btn danger" onClick=${() => confirmIt("Supprimer cette catégorie ?", used ? `${used} opérations deviendront « sans catégorie ».` : "Elle n'est utilisée par aucune opération.", "Supprimer", async () => { close(); const ops = Object.values(A().tx).filter(t => (t.splits || []).some(s => s.cat === id || s.cat2 === id || (s.arr || []).some(x => x.cat === id))).map(t => ["put", {...t, splits: t.splits.map(s => s.cat === id || s.cat2 === id || (s.arr || []).some(x => x.cat === id) ? {...s, ...(s.cat === id ? {cat: null} : {}), ...(s.cat2 === id ? {cat2: null} : {}), ...((s.arr || []).some(x => x.cat === id) ? {arr: s.arr.filter(x => x.cat !== id)} : {})} : s)}]); ops.push(...kids(id).map(k => ["put", {...k, parent: null}]), ...Object.values(A().bud).filter(b => b.cat === id).map(b => ["del", b]), ["del", c0]); await Store.bulk(ops); })}>Supprimer</button>`}
  </${Sheet}>`;

function RulesView() {

}
const RULE_F = {name: "Libellé", payee: "Tiers", comment: "Commentaire", amount: "Montant", account: "Compte", sign: "Sens", nocat: "Sans catégorie", new: "Opération en création"};
const RULE_OPS = {contains: "contient", not: "ne contient pas", starts: "commence par", equals: "est exactement", empty: "est vide", regex: "expression régulière"};
function condText(c) {
  if (c.f === "account") return "compte = " + accName(c.v);
  if (c.f === "sign") return c.v === "in" ? "crédit" : "débit";
  if (c.f === "nocat") return "sans catégorie";
  if (c.f === "new") return "en création ou import";
  if (c.f === "amount") return `montant ${{equals: "=", gt: ">", lt: "<"}[c.op]} ${c.v}`;
  return `${RULE_F[c.f].toLowerCase()} ${RULE_OPS[c.op] || c.op}${c.op === "empty" ? "" : " « " + c.v + " »"}`;
}
function RuleSheet({id, close}) {
  const r0 = id ? A().rule[id] : null;
  const [f, setF] = useState(() => r0 ? clone(r0) : {name: "", match: "all", conds: [{f: "name", op: "contains", v: ""}], set: {}, off: false});
  const set = (k, v) => setF(o => ({...o, [k]: v}));
  const setA = (k, v) => setF(o => ({...o, set: {...o.set, [k]: v}}));
  const setC = (i, c) => { const n = [...f.conds]; n[i] = c; set("conds", n); };
  const matches = Object.values(A().tx).filter(t => ruleMatch(f, t));
  const sample = matches[0] ? ruleApply(f, clone(matches[0])) : null;
  const save = async (apply) => {
    const r = {...f, k: "rule", id: r0?.id || uid("rule"), name: f.name.trim() || (f.conds[0] ? "Si " + condText(f.conds[0]) : "Règle"), order: f.order ?? rulesList().length};
    Store.put(r); close();
    if (apply) { const ops = matches.filter(t => t.st !== "verrouillee").map(t => ["put", ruleApply(r, clone(t))]); await Store.bulk(ops); toast(`Règle appliquée à ${ops.length} opérations`); }
  };
  const condRow = (c, i) => html`<div style="display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;padding:8px;border-radius:12px;background:var(--surface2)">
    <select aria-label="Champ" value=${c.f} onChange=${e => { const v = e.target.value; setC(i, {f: v, op: v === "amount" ? "equals" : "contains", v: v === "account" ? accList()[0]?.id : v === "sign" ? "out" : ""}); }}>${Object.entries(RULE_F).map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>
    ${c.f === "account" ? html`<${AccSelect} v=${c.v} set=${v => setC(i, {...c, v})} />`
      : c.f === "sign" ? html`<select aria-label="Sens" value=${c.v} onChange=${e => setC(i, {...c, v: e.target.value})}><option value="out">débit</option><option value="in">crédit</option></select>`
      : c.f === "nocat" || c.f === "new" ? html`<span></span>`
      : html`<select aria-label="Condition" value=${c.op} onChange=${e => setC(i, {...c, op: e.target.value})}>${c.f === "amount" ? html`<option value="equals">égal à</option><option value="gt">supérieur à</option><option value="lt">inférieur à</option>` : Object.entries(RULE_OPS).map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>`}
    <button type="button" class="ibtn plain" aria-label="Retirer la condition" onClick=${() => set("conds", f.conds.filter((_, j) => j !== i))}><${Ic} n="x" s=${16} /></button>
    ${!["account", "sign", "nocat", "new"].includes(c.f) && c.op !== "empty" && html`<input style="grid-column:1/3" aria-label="Valeur" value=${c.v} onInput=${e => setC(i, {...c, v: e.target.value})} placeholder=${c.op === "regex" ? "ex. ^CB (.*) \\d{2}/\\d{2}$" : ""} />`}
  </div>`;
  const A2 = f.set || {};
  return html`<${Sheet} title=${r0 ? "Règle" : "Nouvelle règle"} close=${close} right=${html`<button class="link" onClick=${() => save(false)}>Enregistrer</button>`}>
    <${Field} label="Nom" id="ru-n"><input id="ru-n" value=${f.name} onInput=${e => set("name", e.target.value)} placeholder="Ex. Courses Monoprix" /></${Field}>
    <div class="field"><span class="lb">Si</span>
      ${f.conds.map(condRow)}
      <div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="link" onClick=${() => set("conds", [...f.conds, {f: "name", op: "contains", v: ""}])}>+ Condition</button>${f.conds.length > 1 && html`<${Seg} v=${f.match} set=${v => set("match", v)} opts=${[["all", "toutes"], ["any", "au moins une"]]} />`}</div>
    </div>
    <div class="field"><span class="lb">Alors</span>
      <${CatField} v=${A2.cat} set=${v => setA("cat", v)} />
      <input aria-label="Renommer en" placeholder="Renommer le libellé en… (facultatif)" value=${A2.rename || ""} onInput=${e => setA("rename", e.target.value)} />
      <div style="padding:8px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px">
        <span class="help">Remplacer par expression régulière ($1, $2… reprennent les morceaux entre parenthèses)</span>
        <div class="grid2"><select aria-label="Champ à modifier" value=${A2.reField || "name"} onChange=${e => setA("reField", e.target.value)}><option value="name">dans le libellé</option><option value="payee">dans le tiers</option><option value="comment">dans le commentaire</option></select><input aria-label="Chercher" placeholder="Chercher, ex. ^CB " value=${A2.re || ""} onInput=${e => setA("re", e.target.value)} /></div>
        <input aria-label="Remplacer par" placeholder="Remplacer par (vide = supprimer)" value=${A2.reTo || ""} onInput=${e => setA("reTo", e.target.value)} />
      </div>
      <div class="grid2"><input aria-label="Tiers" list="dl-rp" placeholder="Tiers" value=${A2.payee || ""} onInput=${e => setA("payee", e.target.value)} /><input aria-label="Projet" placeholder="Projet" value=${A2.project || ""} onInput=${e => setA("project", e.target.value)} /></div>
      <datalist id="dl-rp">${suggest("payee").map(x => html`<option value=${x} />`)}</datalist>
      <div class="grid2"><select aria-label="Moyen de paiement" value=${A2.pay || ""} onChange=${e => setA("pay", e.target.value || null)}><option value="">Moyen inchangé</option>${Object.entries(PAY).map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>
        <select aria-label="Statut" value=${A2.st || ""} onChange=${e => setA("st", e.target.value || null)}><option value="">Statut inchangé</option><option value="pointee">Pointée</option><option value="saisie">Saisie</option></select></div>
      <input aria-label="Commentaire" placeholder="Mettre ce commentaire" value=${A2.comment || ""} onInput=${e => setA("comment", e.target.value)} />
      <div style="padding:8px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px">
        <span class="help">Extraire une date du libellé : (jour)(mois) et éventuellement (année) entre parenthèses, dans cet ordre.</span>
        <div class="grid2"><input aria-label="Expression de date" placeholder="ex. (\\d{2})/(\\d{2})" value=${A2.dateRe || ""} onInput=${e => setA("dateRe", e.target.value)} /><select aria-label="Champ de date" value=${A2.dateField || "vdate"} onChange=${e => setA("dateField", e.target.value)}><option value="vdate">→ date de valeur</option><option value="date">→ date</option></select></div>
      </div>
      <${Toggle} on=${!!A2.payeeFromName} set=${v => setA("payeeFromName", v)} label="Copier le libellé dans le tiers" sub="Après le remplacement éventuel." />
      <${Toggle} on=${!!A2.clearComment} set=${v => setA("clearComment", v)} label="Vider le commentaire" />
    </div>
    <${Toggle} on=${!!f.stop} set=${v => set("stop", v)} label="Arrêter après cette règle" />
    ${r0 && html`<${Toggle} on=${!f.off} set=${v => set("off", !v)} label="Règle active" />`}
    <div class="help">${matches.length} opérations existantes correspondent.${sample ? html` Exemple : « ${matches[0].name} » → « ${sample.name} »${sample.payee ? ", tiers « " + sample.payee + " »" : ""}${sample.splits?.[0]?.cat ? ", " + catName(sample.splits[0].cat) : ""}.` : ""}</div>
    <button class="btn pri" onClick=${() => save(false)}>Enregistrer</button>
    ${matches.length > 0 && html`<button class="btn" onClick=${() => save(true)}>Enregistrer et appliquer aux ${matches.length} opérations</button>`}
    ${r0 && html`<button class="btn danger" onClick=${() => { Store.del(r0); close(); }}>Supprimer la règle</button>`}
  </${Sheet}>`;
}

/* « Passée à la banque aujourd'hui ? » : une opération validée datée après aujourd'hui (v68). Rien ne change sans ton choix. */
function TodaySheet({ids, close}) {

/* Plus de bandeau « Annuler » après une modification (demande de Nicolas, v58) : l'historique reste dans Réglages › Annuler une modification */
function HistView() {
  const [, setN] = useState(0); useEffect(() => { const f = () => setN(n => n + 1); Hist.ls.add(f); return () => Hist.ls.delete(f); }, []);
  const L = Hist.list;
  const when = iso => { const d = new Date(iso); return d.toLocaleDateString("fr-FR", {day: "numeric", month: "short"}) + " à " + d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}); };
  return html`<${Top} title="Historique" back /><main class="scr">
    <div class="help" style="padding:0 4px">Tes 40 dernières modifications sur cet appareil. Touche « Annuler » pour revenir en arrière.</div>
    <div class="card">${L.length ? L.map(c => { const ok = Hist.canUndo(c); return html`<div class="row" style="min-height:56px"><span class="grow"><div class="t1" style="white-space:normal">${c.label}</div><div class="t2">${when(c.at)}${ok ? "" : " · modifié depuis"}</div></span>${ok ? html`<button class="btn sm" onClick=${() => Hist.undo(c)}>Annuler</button>` : html`<button class="btn sm" onClick=${() => confirmIt("Annuler quand même ?", "Ces éléments ont été modifiés depuis. Ils reviendront à leur état d'avant cette modification.", "Annuler quand même", () => Hist.undo(c))}>Annuler</button>`}</div>`; }) : html`<div class="empty"><b>Rien pour l'instant</b>Tes ajouts, modifications et suppressions apparaîtront ici.</div>`}</div>
  </main>`;
}
function ToastHost() {

function App() {
  const [, setV] = useState(0); useEffect(() => { const u = Store.sub(setV); setV(Store.v); return u; }, []);
  const [tab, setTab] = useState(readHash());
  const [stack, setStack] = useState([]);
  const [sheets, setSheets] = useState([]);
  useEffect(() => { const f = () => { setTab(readHash()); setStack([]); }; addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  NAV.push = v => { setStack(s => [...s, v]); appTop(); };
  NAV.pop = () => setStack(s => s.slice(0, -1));
  NAV.tab = t => { setStack([]); setTab(t); try { history.replaceState(null, "", "#" + t); } catch { location.hash = t; } appTop(); };
  SHEET.open = s => setSheets(x => [...x, {...s, key: uid("sh")}]);
  SHEET.close = () => { setSheets(x => x.slice(0, -1)); resetSoon(); }; /* après une saisie : la page et la barre du bas reprennent leur place */
  const hasSet = !!A().set.set_main;
  if (!NEWS_DONE && (hasSet || Store.ready)) { NEWS_DONE = true; newsBoot(hasSet); }
  { const th = S().theme; const el = document.documentElement; if (th === "light" || th === "dark") { if (el.dataset.theme !== th) el.dataset.theme = th; } else if (el.dataset.theme) delete el.dataset.theme; }
  if (Store.bad) return html`<${Recover} /><${ToastHost} />`;
  if (Store.mode === "error") return html`<div class="ob"><h1>Pécule</h1><p class="lead">Impossible d'accéder à tes données pour le moment. Recharge la page dans un instant.</p></div>`;

    ${sheets.map((s, i) => html`<${SheetHost} key=${s.key} s=${s} close=${() => setSheets(x => x.filter(y => y.key !== s.key))} />`)}

/* Haut de l'écran : c'est #app qui défile, pas la page */
function appTop() { const el = document.getElementById("app"); if (el) el.scrollTop = 0; }
/* iOS décale parfois la page quand le clavier se ferme : on la remet en place pour que la barre du bas reste collée en bas */
/* iOS 26 : après la fermeture du clavier (une saisie validée par exemple), la page peut rester décalée ou plus haute que l'écran,
   et la barre du bas est alors coupée. On remet la page en haut et on cale tout ce qui est accroché en bas sur la partie visible (--vvb). */
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function fitViewport() {
  const vv = window.visualViewport, root = document.documentElement; if (!vv) return;
  const gap = Math.round(window.innerHeight - vv.height - vv.offsetTop);
  const v = typing() || gap > 120 || gap < 1 || Math.abs((vv.scale || 1) - 1) > .01 ? 0 : gap; /* clavier ouvert ou page agrandie : rien ; petit écart sans clavier : la barre remonte d'autant */
  root.style.setProperty("--vvb", (v + .01) + "px"); /* changer la valeur force iOS à replacer la barre */
  requestAnimationFrame(() => root.style.setProperty("--vvb", v + "px"));
}
function resetPage() { if (typing()) return; window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; fitViewport(); }
const resetSoon = () => [60, 300, 700].forEach(t => setTimeout(resetPage, t));
document.addEventListener("focusout", () => setTimeout(() => { if (!typing()) resetSoon(); }, 20));
if (window.visualViewport) { visualViewport.addEventListener("resize", () => { if (!typing()) resetSoon(); }); visualViewport.addEventListener("scroll", () => { if (!typing()) fitViewport(); }); }
window.addEventListener("resize", fitViewport);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resetSoon(); });
setTimeout(fitViewport, 400);
render(html`<${App} />`, document.getElementById("app"));
Store.init();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("./sw.js"); } catch {} }
