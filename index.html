<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5BFF">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pécule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pécule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Pécule : épuré et moderne. Fond clair, cartes à trait fin sans ombre, un seul accent indigo, chiffres en gras ; une colonne iPhone, barre d'onglets flottante */
  --bg:#F6F7FB; --surface:#FFFFFF; --surface2:#F2F4F9; --ink:#0B1430; --muted:#6B7491; --line:#E7EAF1;
  --accent:#3D5AFE; --accent2:#00B8A9; --hero:#3D5AFE; --hero2:#6A7CFF; --hero-ink:#0B1430; --hero-muted:#6B7491; --sun:#FFD25E;
  --pos:#0E9F6E; --neg:#E5484D; --warn:#E08A00;
  --display:"Space Grotesk",Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:20px; --shadow:0 1px 3px rgba(15,23,42,.06),0 0 0 1px rgba(15,23,42,.035); --low:#EA580C; --bmix:100%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218; --surface:#181C24; --surface2:#20252F; --ink:#EEF1F6; --muted:#A3ACBB; --line:#252B36;
    --accent:#7AA2FF; --accent2:#2FD3C3; --hero:#7AA2FF; --hero2:#9DB9FF; --hero-ink:#EEF1F6; --hero-muted:#A3ACBB; --sun:#FFD25E;
    --pos:#6EE7A8; --neg:#FF8A80; --warn:#F7B23B; --shadow:0 0 0 1px var(--line); --low:#FF9E6B; --bmix:72%; --segon:#2E3544;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#181C24; --surface2:#20252F; --ink:#EEF1F6; --muted:#A3ACBB; --line:#252B36;
  --accent:#7AA2FF; --accent2:#2FD3C3; --hero:#7AA2FF; --hero2:#9DB9FF; --hero-ink:#EEF1F6; --hero-muted:#A3ACBB; --sun:#FFD25E;
  --pos:#6EE7A8; --neg:#FF8A80; --warn:#F7B23B; --shadow:0 0 0 1px var(--line); --low:#FF9E6B; --bmix:72%; --segon:#2E3544;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.top .ttl{flex:1;min-width:0}
.top .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.dot.off{background:var(--warn)}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn.plain{background:none;box-shadow:none}
.ibtn:disabled{opacity:.28}
.scr{padding:4px 16px calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px;gap:8px}
.sec-h h2{font-family:var(--body);font-size:16px;margin:0;letter-spacing:-.01em;font-weight:700;color:var(--ink)}
.accseg{display:grid;gap:4px;padding:4px;background:color-mix(in srgb,var(--ink) 7%,var(--bg));border-radius:14px}
.accseg button{height:40px;border:0;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.accseg button.on{background:var(--segon,var(--surface));color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip-s{min-width:44px;height:32px;border-radius:16px;font-size:13px;font-weight:600;padding:0 8px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip-s.on{border-color:var(--accent);background:var(--accent);color:var(--surface)}
.brow{padding:12px 0;display:flex;flex-direction:column;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit}
.brow:last-child{border-bottom:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:15px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;font:inherit;min-height:60px}
.card>.row:first-child,.card>div>.row:first-child{border-top:0}
button.row:active{background:var(--surface2)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.ic.sm{width:30px;height:30px;border-radius:50%;font-size:15px}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.amt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .bad{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hero{background:var(--surface);color:var(--ink);border-radius:24px;padding:20px 20px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .lbl{font-size:13.5px;color:var(--hero-muted);font-weight:600;display:flex;align-items:center;gap:8px;position:relative}
.hero .cap{font-size:13px;color:var(--hero-muted);margin-top:12px;font-weight:600;position:relative}
.hero .big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:4px 0 4px;font-variant-numeric:tabular-nums;position:relative}
.hero .hint{font-size:13.5px;color:var(--hero-muted);max-width:40ch;position:relative}
.hero .chart text{fill:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;position:relative}
.brk .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hero .chart{margin-top:10px;position:relative}
.card.pad{padding:16px}
.qas{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:12.5px;font-weight:600;color:var(--ink);padding:4px 0}
.qa-i{width:50px;height:50px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);font-size:20px}
.datebox{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;line-height:1.05;flex:none;text-transform:uppercase}
.datebox b{font-size:16px;color:var(--ink)}
.hbar{background:none;border:0;padding:0;text-align:left;width:100%;color:inherit}
.tile .d{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.tile .d.bad{color:var(--neg)} .tile .d.pos{color:var(--pos)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.acard{flex:none;width:200px;scroll-snap-align:start;border:0;text-align:left;border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.acard .n{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.acard .b{font-size:21px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acard .s{font-size:12px;color:var(--muted)}
.greet{font-size:14px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 97%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;max-width:480px;width:100%}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:none;border:0;padding:6px 0 4px;font-weight:600;white-space:nowrap;min-width:0;min-height:50px;justify-content:center}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.3}
.tab-plus{display:flex;justify-content:center}
.tab-plus button:not(.bub){width:56px;height:56px;margin-top:-24px;border-radius:28px;border:4px solid var(--bg);background:var(--accent);color:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.wiz{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;justify-content:center;animation:fade .15s ease}
.wiz-in{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.wiz-q{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1.15}
.wiz-k{font-size:13px;color:var(--muted);font-weight:500}
.wtile{text-align:left;height:112px;border-radius:20px;border:1px solid var(--line);background:var(--bg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.wtile .wi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.wbig{min-height:56px;border-radius:16px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;display:flex;align-items:center;gap:8px;text-align:left}
.wbig.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--accent)}
.wkey{height:52px;border:0;border-radius:14px;background:transparent;font-size:26px;font-weight:500;color:var(--ink)}
.wkey:active{background:var(--line)}
.wgo{width:100%;min-height:56px;flex:none;border:0;border-radius:16px;font-size:16px;font-weight:600;background:var(--accent);color:var(--surface)}
.wgo:disabled{background:var(--line);color:var(--muted)}
.wsw{width:50px;height:30px;border-radius:15px;padding:3px;display:flex;background:color-mix(in srgb,var(--ink) 18%,transparent);flex:none}
.wsw.on{justify-content:flex-end;background:var(--accent)}
.wsw i{width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.dcirc{width:44px;height:44px;border-radius:22px;background:color-mix(in srgb,var(--ink) 6%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dcirc b{font-size:16px;line-height:1}.dcirc span{font-size:10px;color:var(--muted);margin-top:2px}
.nest{margin:0 0 4px 34px;border-left:2px solid var(--line);padding-left:4px}
.nest .row{min-height:50px}
.dchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.dchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink)}
.bub{width:26px;height:26px;border-radius:13px;border:2px solid var(--surface);background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0;flex:none;box-shadow:0 2px 6px rgba(15,23,42,.25);vertical-align:middle;animation:fade .2s ease}
.bub.on{background:var(--ink);color:var(--surface)}
.helptip{position:fixed;left:12px;right:12px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:15;max-width:456px;margin:0 auto;background:#0F172A;color:#fff;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(15,23,42,.3)}
.accpill{height:42px;padding:0 14px 0 6px;border-radius:21px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink);min-width:0;max-width:100%}
.accpill .ini{width:30px;height:30px;border-radius:15px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:left}
.tile .l{font-size:12px;color:var(--muted)}.tile .v{font-size:16px;font-weight:600;margin-top:2px}
.bpill{flex:none;width:150px;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.dcol{width:40px;text-align:center;flex:none}.dcol b{display:block;font-size:17px;line-height:1}.dcol span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.fgh{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 6px 6px}
.hbtn{width:44px;height:44px;border-radius:22px;border:0;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hbtn.pri{background:var(--accent);color:var(--surface);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 42%,transparent);display:grid;place-items:center}
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(9,13,24,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 20px);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--line);gap:8px}
.sheet-h strong{font-family:var(--display);font-size:16px;font-weight:800;text-align:center}
.sheet-h .r{justify-self:end}
.sheet-h .l{justify-self:start}
.sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.help{font-size:12.5px;color:var(--muted);margin:0 2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:70px;resize:vertical}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]:disabled{opacity:.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.amount-in{font-family:var(--display);font-size:40px;font-weight:800;text-align:center;border:0;background:none;box-shadow:none!important;padding:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(14,26,60,.12)}
.seg.exp button.on{color:var(--neg)} .seg.inc button.on{color:var(--pos)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.danger{color:var(--neg)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.off{opacity:.45;text-decoration:line-through}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip{flex:none}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;border-radius:inherit;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.pill.bad{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.st{width:30px;height:30px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none;padding:0;color:var(--muted)}
.planned{opacity:.62}
.planned .t1{font-style:italic}
.cancel .t1,.cancel .amt{text-decoration:line-through;opacity:.55}

function Donut({parts, total, label}) {
  const R = 62, r = 40, C = 80; let a0 = -Math.PI / 2;
  const segs = parts.filter(p => p.v > 0).map(p => {
    const a1 = a0 + (p.v / total) * Math.PI * 2 * 0.9999, large = a1 - a0 > Math.PI ? 1 : 0;
    const pt = (rad, a) => `${(C + rad * Math.cos(a)).toFixed(2)},${(C + rad * Math.sin(a)).toFixed(2)}`;
    const d = `M${pt(R, a0)}A${R},${R} 0 ${large} 1 ${pt(R, a1)}L${pt(r, a1)}A${r},${r} 0 ${large} 0 ${pt(r, a0)}Z`;
    a0 = a1; return html`<path d=${d} fill=${p.c} stroke="var(--surface)" stroke-width="1.5" />`;
  });
  return html`<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label=${label}>
    ${total > 0 ? segs : html`<circle cx=${C} cy=${C} r=${(R + r) / 2} fill="none" stroke="var(--surface2)" stroke-width=${R - r} />`}
    <text x=${C} y=${C - 2} text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-size:17px;font-weight:700">${fmt0(total)}</text>
    <text x=${C} y=${C + 15} text-anchor="middle" style="font-size:11px">${label}</text>
  </svg>`;
}
function Bars({rows}) {
  const W = 340, H = 180, top = 12, bot = 26, left = 6;
  const mx = Math.max(1, ...rows.flatMap(r => [r.inc, r.exp]));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(mx))); return Math.ceil(mx / p) * p; })();
  const bw = (W - left) / rows.length, y = v => top + (H - top - bot) * (1 - v / nice);
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Revenus et dépenses par mois">
    ${[0, .5, 1].map(f => html`<line x1=${left} x2=${W} y1=${y(nice * f)} y2=${y(nice * f)} stroke="var(--line)" /><text x=${W} y=${y(nice * f) - 3} text-anchor="end">${fmt0(nice * f)}</text>`)}
    ${rows.map((r, i) => { const x0 = left + i * bw + bw * .18, w = bw * .3; return html`
      <rect x=${x0} y=${y(r.inc)} width=${w} height=${Math.max(0, y(0) - y(r.inc))} rx="3" fill="var(--pos)" opacity=${r.future ? .4 : 1} />
      <rect x=${x0 + w + 2} y=${y(r.exp)} width=${w} height=${Math.max(0, y(0) - y(r.exp))} rx="3" fill="var(--accent)" opacity=${r.future ? .4 : 1} />
      <text x=${x0 + w} y=${H - 8} text-anchor="middle" style=${r.cur ? "fill:var(--ink);font-weight:700" : ""}>${monthShort(r.k)}</text>`; })}
  </svg>`;
}
function Line({pts, splitAt}) {
  if (pts.length < 2) return html`<div class="empty">Pas encore assez d'historique.</div>`;
  const W = 340, H = 190, top = 14, bot = 26, left = 6, right = 6;
  const vals = pts.map(p => p.v), mn0 = Math.min(...vals), mx0 = Math.max(...vals), pad0 = (mx0 - mn0) * .12 || Math.abs(mx0) * .1 || 100;
  const mn = mn0 - pad0, mx = mx0 + pad0, avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const x = i => left + i * (W - left - right) / (pts.length - 1), y = v => top + (H - top - bot) * (1 - (v - mn) / (mx - mn));
  const path = arr => arr.map(([i, v], j) => `${j ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const past = pts.map((p, i) => [i, p.v]).filter(([i]) => i <= splitAt), fut = pts.map((p, i) => [i, p.v]).filter(([i]) => i >= splitAt);
  const area = path(past) + `L${x(past[past.length - 1][0])},${H - bot}L${x(0)},${H - bot}Z`;
  const ref = (v, l) => html`<line x1=${left} x2=${W - right} y1=${y(v)} y2=${y(v)} stroke="var(--muted)" stroke-dasharray="2 4" opacity=".55" /><text x=${left + 2} y=${y(v) - 3}>${l} ${fmt0(v)}</text>`;
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Évolution du solde">
    ${ref(mx0, "max")}${ref(mn0, "min")}${Math.abs(avg - mx0) > (mx - mn) * .1 && Math.abs(avg - mn0) > (mx - mn) * .1 ? ref(avg, "moy.") : ""}
    ${mn < 0 && mx > 0 && html`<line x1=${left} x2=${W - right} y1=${y(0)} y2=${y(0)} stroke="var(--neg)" opacity=".5" />`}
    <path d=${area} fill="color-mix(in srgb, var(--accent) 12%, transparent)" />
    <path d=${path(past)} fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" />
    ${fut.length > 1 && html`<path d=${path(fut)} fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="5 5" />`}
    ${pts.map((p, i) => html`<circle cx=${x(i)} cy=${y(p.v)} r=${i === splitAt ? 4.5 : 2.5} fill=${i === splitAt ? "var(--accent)" : "var(--surface)"} stroke="var(--accent)" stroke-width="2" />`)}
    ${pts.map((p, i) => (i % Math.ceil(pts.length / 7) === 0 || i === pts.length - 1) && html`<text x=${x(i)} y=${H - 8} text-anchor=${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"} style=${i === splitAt ? "fill:var(--ink);font-weight:700" : ""}>${p.l}</text>`)}
  </svg>`;
}

/* ============ Vue d'ensemble ============ */

    const cardIds = Object.values(A().acc).filter(c => c.type === "carte" && c.linked === id).map(c => c.id);

    const b = shownBal(a), bAll = balance(id), occ = occurrences(E);
    const eomB = r2(balance(id, {upTo: E}) + occ.reduce((s, o) => s + amtFor(o, id), 0));
    const span = [3, 6, 12, 24].includes(Number(S().glanceSpan)) ? Number(S().glanceSpan) : 12;

    const lim = a.warn != null && a.warn !== "" ? Number(a.warn) : 0;
    const lowPt = ser && inCash(a) ? ser.find(p => p[0] >= t && p[0] <= E && p[1] < lim) : null;
    const lines = budgets().filter(bd => { const ba = bAccs(bd); return !ba.length || ba.some(x => scope.has(x)); }).flatMap(bd => linesOf(bd.id).filter(l => !l.income).map(l => lineAt(l, t)).filter(x => x && x.bud > 0));

    const due = dueNow().filter(o => sides(o).some(([x]) => scope.has(x)));
    const uncat = Object.values(A().tx).filter(x => scope.has(x.account) && x.st !== "annulee" && x.date >= ps && x.date <= t && (x.splits || []).some(sp => !sp.cat && !sp.to)).length;

    else if (uncat) { lvl = "warn"; title = uncat + " opération" + (uncat > 1 ? "s" : "") + " à ranger"; sub = "Sans catégorie, elles échappent aux budgets."; }
    const inR = (x, f, to) => x.date >= f && x.date <= to;
    const spent = (f, to) => { let e = 0; for (const x of Object.values(A().tx)) { if (x.st === "annulee" || !scope.has(x.account) || !inR(x, f, to)) continue; for (const sp of x.splits || []) if (!sp.to && !sp.noRep && (sp.amount < 0 || sp.refund)) e -= sp.amount; } return r2(e); };

function debitDates(day, n = 3) { const t = today(), d0 = Number(day) || 4, out = []; let k = ym(t); for (let g = 0; out.length < n && g < 24; g++, k = ymAdd(k, 1)) { const [y, m] = k.split("-").map(Number); const d = `${k}-${pad(Math.min(d0, dim(y, m)))}`; if (d >= t) out.push(d); } return out; }

    x.rates = (x.rates && x.rates.length ? x.rates : (x.rate ? [{from: S().start || today(), rate: x.rate}] : [])).map(r => ({...r, rs: amtStr(r.rate)}));
    x.loan = {...x.loan, rates: (x.loan.rates || []).map(r => ({...r, rs: amtStr(r.rate)})), pays: (x.loan.pays || []).map(r => ({...r, rs: amtStr(r.rate)}))};
    return x; });
  const set = (k, v) => setF(x => ({...x, [k]: v}));
  const setL = (k, v) => setF(x => ({...x, loan: {...x.loan, [k]: v}}));
  const [err, setErr] = useState("");
  const isCard = f.type === "carte", isLoan = f.type === "pret";
  const save = () => {
    if (!f.name.trim()) return setErr("Donne un nom au compte.");
    const v = calc(f.initialStr || "0"); if (isNaN(v)) return setErr("Le solde de départ n'est pas un nombre.");
    const initial = isCard || isLoan ? -Math.abs(v) : (f.neg ? -Math.abs(v) : v);
    const a = {...(a0 || {}), k: "acc", id: a0?.id || uid("acc"), name: f.name.trim(), type: f.type, emoji: f.emoji || "💳", color: f.color, initial: r2(initial), warn: f.warn === "" || f.warn == null ? null : calc(f.warn), inTotal: f.inTotal !== false, inCash: f.inCash ?? null, hidden: !!f.hidden, order: f.order ?? Object.keys(A().acc).length, number: f.number || null, joint: f.type === "courant" && !!f.joint};
    if (isCard) { const legacy = a0 && !a0.initDebit; a.initDebit = Math.abs(v) > 0.004 ? (f.initDebit || (legacy ? null : debitDates(f.debitDay)[0])) : null; a.debitDay = Number(f.debitDay) || 4; a.closeDay = Number(f.closeDay) || 0; a.linked = f.linked || null; if (!a.linked) return setErr("Choisis le compte sur lequel la carte est débitée."); } else { delete a.debitDay; delete a.linked; delete a.closeDay; }
    if (f.type === "epargne") { a.rates = f.rates.filter(r => r.from && !isNaN(calc(r.rs))).map(r => ({from: r.from, rate: calc(r.rs)})).sort((x, y) => x.from.localeCompare(y.from)); a.rate = a.rates.length ? a.rates[a.rates.length - 1].rate : null; a.intFreq = f.intFreq || "y"; a.intCat = f.intCat || null; } else { delete a.rates; delete a.intFreq; }
    if (isLoan) { const L = f.loan; const pay = calc(L.payment); if (!(pay > 0)) return setErr("Indique la mensualité du prêt, ou calcule-la."); if (!L.from) return setErr("Choisis le compte qui paie le prêt.");
      a.loan = {payment: pay, rate: calc(L.rate || "0") || 0, ins: calc(L.ins || "0") || 0, from: L.from, first: L.first || `${ym(start)}-05`, n: L.n ? Number(L.n) : null, borrowed: L.borrowed ? calc(L.borrowed) : null, catInt: L.catInt || null, catIns: L.catIns || null,
        rates: (L.rates || []).filter(r => r.from && !isNaN(calc(r.rs))).map(r => ({from: r.from, rate: calc(r.rs)})),
        pays: (L.pays || []).filter(r => r.from && calc(r.rs) > 0).map(r => ({from: r.from, rate: calc(r.rs)}))}; } else delete a.loan;

    a.website = f.website ? (/^https?:\/\//.test(f.website) ? f.website : "https://" + f.website) : null; a.comment = f.comment || null;

/* ============ Pointage d'un relevé ============ */
function Reconcile({id, close}) {
  const a = A().acc[id];
  const [d, setD] = useState(a.lastStatement?.next || today());
  const [bal, setBal] = useState("");
  const [neg, setNeg] = useState(a.type === "carte" || balance(id) < 0);
  const list = (idx()[id] || []).map(([x]) => x).filter(x => x.st !== "annulee" && sideSt(x, id) !== "verrouillee" && x.date <= d).sort((p, q) => p.date.localeCompare(q.date));
  const [sel, setSel] = useState(() => new Set(list.filter(x => sideSt(x, id) === "pointee").map(x => x.id)));
  const base = balance(id, {locked: true});
  const pointed = r2(base + list.filter(x => sel.has(x.id)).reduce((s, x) => s + amtFor(x, id), 0));
  const target = calc(bal), tgt = isNaN(target) ? null : (neg ? -Math.abs(target) : target);
  const diff = tgt == null ? null : r2(tgt - pointed);
  const tog = x => { const n = new Set(sel); n.has(x.id) ? n.delete(x.id) : n.add(x.id); setSel(n); };
  const write = async lock => {
    const ops = [];
    const sid = uid("stm"); let count = 0;
    for (const x of list) { const cur = sideSt(x, id); const want = sel.has(x.id) ? (lock ? "verrouillee" : "pointee") : (cur === "importee" ? "importee" : "saisie");
      if (cur !== want || (lock && sel.has(x.id))) { let y = setSide(x, id, want); if (lock && sel.has(x.id)) { y = x.account === id ? {...y, stmt: sid} : {...y, stmt2: sid}; count++; } ops.push(["put", y]); } }
    if (lock) { const acc = A().acc[id]; ops.push(["put", {...acc, lastStatement: {date: d, bal: tgt, next: addDays(d, 30)}, statements: [...(acc.statements || []), {id: sid, date: d, start: base, end: tgt, count}]}]); }
    close(); await Store.bulk(ops); toast(lock ? "Relevé verrouillé" : "Pointage enregistré");
  };
  return html`<${Sheet} title="Pointer un relevé" close=${close}>
    <div class="grid2">
      <${Field} label="Date du relevé" id="rc-d"><input id="rc-d" type="date" value=${d} onInput=${e => setD(e.target.value)} /></${Field}>
      <${Field} label="Solde du relevé" id="rc-b"><div style="display:flex;gap:6px"><button type="button" class="btn sm" onClick=${() => setNeg(!neg)} aria-label="Changer le signe">${neg ? "−" : "+"}</button><input id="rc-b" inputmode="decimal" value=${bal} onInput=${e => setBal(e.target.value)} placeholder="0,00" /></div></${Field}>
    </div>
    <div class="card" style="padding:12px 14px">
      <div class="kv"><span>Solde de départ${a.statements?.length ? " (relevé du " + dayShort(a.statements[a.statements.length - 1].date) + ")" : ""}</span><span>${fmt(base)}</span></div>
      ${a.statements?.length > 0 && Math.abs((a.statements[a.statements.length - 1].end ?? base) - base) > 0.004 && html`<div class="help" style="color:var(--warn)">Le relevé précédent finissait à ${fmt(a.statements[a.statements.length - 1].end)} : une opération verrouillée a peut-être été modifiée.</div>`}
      <div class="kv"><span>Solde pointé</span><span>${fmt(pointed)}</span></div>
      <div class="kv"><span>Écart avec le relevé</span><span class=${diff == null ? "muted" : Math.abs(diff) < 0.005 ? "pos" : "bad"}>${diff == null ? "—" : Math.abs(diff) < 0.005 ? "0,00 € ✓" : fmt(diff, true)}</span></div>
    </div>
    <div class="help">Coche chaque opération présente sur le relevé. Quand l'écart tombe à zéro, tu peux verrouiller.</div>
    <div class="card">${list.length ? list.map(x => html`<button class="row" onClick=${() => tog(x)}>
      <span class=${"check" + (sel.has(x.id) ? " on" : "")}>${sel.has(x.id) && html`<${Ic} n="check" s=${14} w=${3} />`}</span>
      <span class="grow"><div class="t1">${x.name}</div><div class="t2">${dayLabel(x.date)}</div></span>
      <span class="amt ${amtFor(x, id) > 0 ? "pos" : ""}">${fmt(amtFor(x, id), true)}</span></button>`) : html`<div class="empty">Aucune opération à pointer jusqu'à cette date.</div>`}</div>
    <div class="btns"><button class="btn" onClick=${() => write(false)}>Enregistrer</button><button class="btn pri" disabled=${diff == null || Math.abs(diff) >= 0.005} onClick=${() => write(true)}><${Ic} n="lock" s=${17} />Verrouiller</button></div>
  </${Sheet}>`;
}

/* ============ Import ============ */
function ImportSheet({acc, close}) {
  const [accId, setAcc] = useState(acc || accList()[0]?.id);
  const [rows, setRows] = useState(null);
  const [csv, setCsv] = useState(null);
  const [map, setMap] = useState({});
  const [opts, setOpts] = useState({rules: true, point: true, byName: true});
  const [over, setOver] = useState({});
  const [busy, setBusy] = useState(null);
  const [err, setErr] = useState("");
  const [raw, setRaw] = useState(null);
  const saved = A().acc[accId]?.imp || {};
  const [cfg, setCfg] = useState({enc: saved.enc || "auto", df: saved.df || "auto", skip: saved.skip || 0, header: saved.header !== false});
  const decode = (buf, enc) => { if (enc === "auto") { const t = new TextDecoder("utf-8").decode(buf); return t.includes(String.fromCharCode(0xFFFD)) ? new TextDecoder("windows-1252").decode(buf) : t; } return new TextDecoder(enc).decode(buf); };
  const load = (file, c) => {
    const txt = decode(file.buf, c.enc), n = file.name.toLowerCase();
    if (n.endsWith(".ofx") || n.endsWith(".qfx") || /<OFX>/i.test(txt)) { setRows(parseOFX(txt)); setCsv(null); }
    else if (n.endsWith(".qif") || /^!Type/m.test(txt)) { setRows(parseQIF(txt).map(r => ({...r, date: c.df === "auto" ? r.date : r.date}))); setCsv(null); }
    else { let r = parseCSV(txt).slice(Number(c.skip) || 0); if (r.length < 1) return setErr("Fichier vide ou illisible.");
      if (!c.header) r = [r[0].map((_, i) => "Colonne " + (i + 1)), ...r];
      const h = r[0].map(norm); const fi = re => h.findIndex(x => re.test(x));
      const keep = saved.map && saved.cols === r[0].length ? saved.map : null;
      setMap(keep || {date: Math.max(0, fi(/date/)), name: Math.max(0, fi(/libell|descri|intitul|nom|label/)), amount: fi(/montant|amount|somme/), debit: fi(/debit/), credit: fi(/credit/), memo: fi(/comment|memo|detail/), payee: fi(/tiers|beneficiaire|payee/)}); setCsv(r); setRows(null); }
  };
  const onFile = async e => { setErr(""); const file = e.target.files[0]; if (!file) return; const f2 = {name: file.name, buf: await file.arrayBuffer()}; setRaw(f2); load(f2, cfg); };
  const setC = (k, v) => { const c = {...cfg, [k]: v}; setCfg(c); if (raw) load(raw, c); };
  const fromCsv = () => {
    const out = [];
    for (const r of csv.slice(1)) {
      const date = parseDateFmt(r[map.date], cfg.df); if (!date) continue;
      let amount = map.amount >= 0 ? parseNum(r[map.amount]) : NaN;
      if (isNaN(amount)) { const d = map.debit >= 0 ? parseNum(r[map.debit]) : NaN, c = map.credit >= 0 ? parseNum(r[map.credit]) : NaN; amount = r2((isNaN(c) ? 0 : Math.abs(c)) - (isNaN(d) ? 0 : Math.abs(d))); }
      if (isNaN(amount) || !amount) continue;
      out.push({date, amount, name: r[map.name] || "", memo: map.memo >= 0 ? r[map.memo] || "" : "", payee: map.payee >= 0 ? r[map.payee] || "" : ""});
    }
    if (!out.length) return setErr("Aucune ligne reconnue. Vérifie les colonnes et le format de date.");
    Store.put({...A().acc[accId], imp: {...cfg, map, cols: csv[0].length}});
    setRows(out); setCsv(null);
  };
  const analysed = useMemo(() => {
    if (!rows) return null;
    const ex = (idx()[accId] || []).map(([x]) => x); const used = new Set();
    return rows.map(r => {
      const dup = ex.find(x => (r.fitid && x.fitid === r.fitid) || (x.date === r.date && Math.abs(amtFor(x, accId) - r.amount) < 0.005 && norm(x.name) === norm(r.name)));
      if (dup) return {...r, act: "dup"};
      const m = ex.find(x => !used.has(x.id) && ["saisie", "importee"].includes(sideSt(x, accId)) && Math.abs(amtFor(x, accId) - r.amount) < 0.005 && Math.abs(daysBetween(x.date, r.date)) <= 4);
      if (m) { used.add(m.id); return {...r, act: "match", m}; }
      return {...r, act: "new"};
    });
  }, [rows, accId, Store.v]);
  const actOf = (r, i) => over[i] || r.act;
  const cycle = (r, i) => { const opts2 = r.m ? ["match", "new", "ign"] : ["new", "ign"]; const cur = actOf(r, i) === "dup" ? "ign" : actOf(r, i); setOver({...over, [i]: opts2[(opts2.indexOf(cur) + 1) % opts2.length]}); };
  const go = async () => {
    const ops = [];
    for (const [i, r0] of analysed.entries()) { const r = {...r0, act: actOf(r0, i)};
      if (r.act === "new") { let t = {k: "tx", id: uid("tx"), account: accId, date: r.date, name: r.name || "Opération", amount: r.amount, splits: [{cat: null, amount: r.amount}], st: opts.point ? "pointee" : "importee", pay: guessPay(r.name)}; if (r.memo) t.comment = r.memo; if (r.payee) t.payee = r.payee; if (r.fitid) t.fitid = r.fitid; if (opts.rules) t = applyRules(t, {isNew: true}); if (opts.byName && !t.splits[0].cat) { const c = lastCatByName()[norm(t.name)]; if (c) t.splits[0].cat = c; } ops.push(["put", t]); }
      else if (r.act === "match" && opts.point) ops.push(["put", {...setSide(r.m, accId, "pointee"), fitid: r.fitid || r.m.fitid || null}]);
    }
    setBusy([0, ops.length]); await Store.bulk(ops, (i, n) => setBusy([i, n])); close(); toast(ops.length + " opérations importées ou rapprochées");
  };
  const cols = csv ? csv[0] : [];
  const ColSel = ({k, label, opt}) => html`<${Field} label=${label} id=${"im-" + k}><select id=${"im-" + k} value=${map[k]} onChange=${e => setMap({...map, [k]: Number(e.target.value)})}>${opt && html`<option value="-1">Aucune</option>`}${cols.map((c, i) => html`<option value=${i}>${c || "Colonne " + (i + 1)}</option>`)}</select></${Field}>`;
  const cnt = a => analysed ? analysed.filter((r, i) => (actOf(r, i) === "dup" ? "ign" : actOf(r, i)) === (a === "dup" ? "ign" : a)).length : 0;
  return html`<${Sheet} title="Importer" close=${close}>
    <${Field} label="Dans le compte" id="im-acc"><${AccSelect} id="im-acc" v=${accId} set=${setAcc} /></${Field}>
    ${!rows && !csv && html`<${Field} label="Fichier de ta banque" help="Formats acceptés : OFX, QIF ou CSV. Les réglages du dernier import CSV de ce compte sont repris." id="im-f"><input id="im-f" type="file" accept=".csv,.ofx,.qfx,.qif,.txt,text/csv" onChange=${onFile} /></${Field}>`}
    ${(csv || !rows) && html`<div class="grid2">
      <${Field} label="Encodage" id="im-enc"><select id="im-enc" value=${cfg.enc} onChange=${e => setC("enc", e.target.value)}><option value="auto">Automatique</option><option value="utf-8">UTF-8</option><option value="windows-1252">Windows (Latin-1)</option></select></${Field}>
      <${Field} label="Format des dates" id="im-df"><select id="im-df" value=${cfg.df} onChange=${e => setC("df", e.target.value)}><option value="auto">Automatique</option><option value="dmy">jj/mm/aaaa</option><option value="mdy">mm/jj/aaaa</option><option value="ymd">aaaa-mm-jj</option></select></${Field}>
      <${Field} label="Lignes à sauter au début" id="im-sk"><input id="im-sk" type="number" min="0" value=${cfg.skip} onInput=${e => setC("skip", e.target.value)} /></${Field}>
      <div style="align-self:end"><${Toggle} on=${cfg.header} set=${v => setC("header", v)} label="1re ligne = titres" /></div>
    </div>`}
    ${csv && html`<div class="grid2"><${ColSel} k="date" label="Date" /><${ColSel} k="name" label="Libellé" /><${ColSel} k="amount" label="Montant" opt /><${ColSel} k="memo" label="Commentaire" opt /><${ColSel} k="debit" label="Débit" opt /><${ColSel} k="credit" label="Crédit" opt /><${ColSel} k="payee" label="Tiers" opt /></div>

async function saveFile(filename, data, mime) {
  const blob = new Blob([data], {type: mime});
  try {
    const file = new File([blob], filename, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: filename}); return true; }
  } catch (e) { if (e && e.name === "AbortError") { toast("Partage annulé"); return false; } }
  try { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return true; }
  catch { SHEET.open({type: "copy", title: filename, text: data}); return true; }
}
function exportCSV(ids, only) {

}

function Schedules() {

  const mEq = f => { f = f || {}; return f.u === "m" ? 1 / (f.n || 1) : f.u === "y" ? 1 / (12 * (f.n || 1)) : f.u === "w" ? 52 / 12 / (f.n || 1) : 365 / 12 / (f.n || 1); };

    if (aid === halfJoint()) out.push(["Part de " + halfName() + " (50/50)", "l'avant-dernier jour du mois"]);
    for (const l of accList()) if (l.type === "pret" && l.loan?.from === aid) out.push([l.name, fmt(l.loan.payment) + " le " + Number(l.loan.first.slice(8)) + " de chaque mois"]);
    if (a?.type === "pret" && a.loan) out.push(["Mensualités", fmt(a.loan.payment) + " par mois"]);
    return out; };
  const accs = accList().filter(a => schs.some(x => inv(x, a.id)) || autoOf(a.id).length);

  const sel = A().acc[sel0] && !A().acc[sel0].hidden ? sel0 : accs[0]?.id;
  const setSel = v => { SCH_ACC.v = v; setSel0(v); };

      <span class="grow"><div class="t1">${x.name}</div><div class="t2">${sub}</div></span>

/* ============ Démarrage ============ */
/* ============ Import iCompta : lecture directe du fichier .cdb (SQLite) dans le navigateur ============ */
/* Lecteur SQLite minimal, en lecture seule : tables b-tree, enregistrements, pages de débordement. */
function sqliteOpen(buf) {
  const u8 = new Uint8Array(buf), dv = new globalThis.DataView(buf);

  const payload = (p, P) => {
    const X = U - 35;
    if (P <= X) return u8.subarray(p, p + P);
    const M = Math.floor((U - 12) * 32 / 255) - 23, K = M + ((P - M) % (U - 4)), L = K <= X ? K : M;
    const out = new Uint8Array(P); out.set(u8.subarray(p, p + L)); let got = L, ov = dv.getUint32(p + L);
    while (got < P && ov) { const o = pg(ov), n = Math.min(U - 4, P - got); out.set(u8.subarray(o + 4, o + 4 + n), got); got += n; ov = dv.getUint32(o); }
    return out;
  };
  const record = b => {
    const v = new globalThis.DataView(b.buffer, b.byteOffset, b.byteLength); let p = 0;
    const vi = () => { let x = 0; for (let i = 0; i < 9; i++) { const c = b[p++]; if (i === 8) return x * 256 + c; x = x * 128 + (c & 0x7f); if (!(c & 0x80)) return x; } return x; };
    const hs = vi(), types = []; while (p < hs) types.push(vi());
    let q = hs; const out = [];
    for (const t of types) {
      if (t === 0) out.push(null);
      else if (t >= 1 && t <= 6) { const n = [0, 1, 2, 3, 4, 6, 8][t]; let val = 0; for (let i = 0; i < n; i++) val = val * 256 + b[q + i]; if (b[q] & 0x80) val -= Math.pow(2, 8 * n); out.push(val); q += n; }
      else if (t === 7) { out.push(v.getFloat64(q)); q += 8; }
      else if (t === 8) out.push(0); else if (t === 9) out.push(1);
      else if (t >= 12 && t % 2 === 0) { const n = (t - 12) / 2; out.push(b.subarray(q, q + n)); q += n; }

    if (type === 13) { for (let i = 0; i < cells; i++) { let p = o + dv.getUint16(h + 8 + i * 2), P, rowid; [P, p] = varint(p); [rowid, p] = varint(p); cb(rowid, record(payload(p, P))); } }

    try { const buf = await f.arrayBuffer(); const db = sqliteOpen(buf); if (!db.has("ICTransaction") || !db.has("ICAccount")) throw new Error("Ce fichier n'a pas la structure d'une base iCompta."); setDbf(db); }
    catch (x) { setErr(x && x.message ? x.message : "Lecture impossible."); } setBusy(null); };
  const run = async () => {
    const ops = [];
    if (had) for (const k of ["acc", "tx", "sch", "bdg", "bud", "cat"]) for (const o of Object.values(A()[k] || {})) ops.push(["del", o]);
    const strip = sp => sp.map(x => { const y = {...x}; if (!opt.cat) delete y.cat; if (!opt.bdg) { delete y.bdg; delete y.bm; } return y; });
    const fixTx = o => ({...o, splits: strip(o.splits || []), ...(o.ov ? {ov: Object.fromEntries(Object.entries(o.ov).map(([k, v]) => [k, {...v, splits: strip(v.splits || [])}]))} : {})});
    for (const d of r.acc) ops.push(["put", {...d, joint: d.type === "courant" && joint.includes(d.id)}]);
    for (const d of opt.cat ? r.cat : obCatDocs()) ops.push(["put", d]);
    if (opt.bdg) for (const d of [...r.bdg, ...r.bud]) ops.push(["put", d]);
    if (opt.sch) for (const d of r.sch) ops.push(["put", fixTx(d)]);
    for (const d of r.tx) ops.push(["put", fixTx(d)]);
    setBusy([0, ops.length + 1]);

    await Store.put({...S(), k: "set", id: "set_main", start: r.start, cashCards: true, created: S().created || today(), jointMig: true, halfJoint: null, halfOk: false});

  return html`<div class="wiz" role="dialog" aria-modal="true" aria-label="Importer depuis iCompta"><div class="wiz-in">
    <div style="display:flex;align-items:center;justify-content:space-between"><button class="ibtn" style="border-radius:20px;box-shadow:none;background:var(--bg)" aria-label="Fermer" onClick=${close}><${Ic} n="x" /></button><span></span></div>
    <div><div class="wiz-k">iCompta</div><h2 class="wiz-q">Importer ta base iCompta</h2></div>

      <label class="wgo" style="display:flex;align-items:center;justify-content:center;cursor:pointer">${busy === "lecture" ? "Lecture du fichier…" : "Choisir le fichier iCompta"}<input type="file" style="display:none" onChange=${pick} /></label>
      ${err && html`<div class="banner" role="alert" style="border-color:var(--neg)"><span class="grow"><b>Impossible de lire ce fichier.</b><br />${err}</span></div>`}
      <div class="help">Pécule reprend tes comptes et leurs soldes validés, puis tu choisis : les opérations créées et prévues seulement, ou aussi les validées du mois ; l'échéancier, les catégories et les budgets. Ce qui est validé reste dans iCompta, résumé dans le solde.</div>`}
    ${r && !Array.isArray(busy) && html`
      <div class="card" style="padding:4px 16px;background:var(--bg);box-shadow:none;flex:none">
        <div class="fgh" style="padding:12px 0 4px">${fname} · ${r.acc.length} comptes</div>
        ${r.acc.map(a => html`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px"><span><b>${a.name}</b><span class="muted"> · ${TY[a.type]}${a.linked ? " → " + (r.acc.find(x => x.id === a.linked) || {}).name : ""}</span></span><span style="font-weight:600;white-space:nowrap">${fmt(r.shown && r.shown[a.id] != null ? r.shown[a.id] : a.initial)}</span></div>`)}
      </div>
      ${r.acc.some(a => a.type === "courant") && html`<div style="display:flex;flex-direction:column;gap:8px;flex:none"><div class="fgh" style="padding:4px 0 0" id="ic-joint">Un de ces comptes est-il un compte joint ?</div>
        <div class="chips" role="group" aria-labelledby="ic-joint"><button type="button" class=${"chip" + (!joint.length ? " on" : "")} aria-pressed=${!joint.length ? "true" : "false"} onClick=${() => setJoint([])}>Aucun</button>${r.acc.filter(a => a.type === "courant").map(a => html`<button type="button" class=${"chip" + (joint.includes(a.id) ? " on" : "")} aria-pressed=${joint.includes(a.id) ? "true" : "false"} onClick=${() => setJoint(l => l.includes(a.id) ? l.filter(x => x !== a.id) : [...l, a.id])}>${a.name}</button>`)}</div>
        <div class="help" style="margin:0">Partagé avec une autre personne : Pécule proposera le remboursement 50/50 sur ce compte et ses cartes. Modifiable ensuite dans la fiche du compte.</div></div>`}
      <div class="help">Soldes validés à aujourd'hui. ${opt.pend ? r.tx.length + " opérations reprises : les créées, plus le débit des cartes et la mensualité du prêt du mois." : r.tx.length + " opérations reprises : tout le mois en cours et celles non validées."}</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <${Opt} k="pend" label="Seulement les opérations créées et prévues" n=${r.tx.length} hint=${opt.pend ? "Les validées restent dans iCompta ; les budgets du mois partent de ce qu'il te reste" : "Reprend aussi les opérations validées du mois en cours"} />
        <${Opt} k="sch" label="Échéancier (opérations prévues)" n=${r.sch.length} hint="Conseillé : sans lui, les prévisions sont vides" />
        <${Opt} k="cat" label="Catégories" n=${r.cat.length} hint="Sinon, Pécule propose ses catégories de base" />
        <${Opt} k="bdg" label="Budgets" n=${r.bdg.length} hint="Avec leurs montants et périodes" />
      </div>
      ${had && html`<div class="banner" role="alert"><span class="grow">Cet import <b>remplace</b> les comptes et opérations déjà dans Pécule. Pense à télécharger une sauvegarde avant.</span></div>`}

      <div style="display:flex;gap:10px"><label class="btn" style="flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer">Autre fichier<input type="file" style="display:none" onChange=${pick} /></label><button class="wgo" style="flex:2" onClick=${run}>Importer</button></div>`}
    ${Array.isArray(busy) && html`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center"><b>Import en cours… ne ferme pas l'app</b><div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden"><div style=${`height:8px;background:var(--accent);width:${Math.round(busy[0] / busy[1] * 100)}%`}></div></div><span class="muted">${busy[0]} / ${busy[1]}</span></div>`}
  </div></div>`;
}

  const create = async () => {
    const docs = [];

    OB_CATS.forEach(([n, e, c, t, ch], i) => { const pid = "cat_" + slug(n); docs.push({k: "cat", id: pid, name: n, emoji: e, color: c, type: t, order: i, parent: null}); ch.forEach((x, j) => { if (!off.has(x)) docs.push({k: "cat", id: "cat_" + slug(x), name: x, parent: pid, type: t, order: j}); }); });
    accs.forEach((a, i) => {
      const v = calc(a.bal) || 0;
      const d = {k: "acc", id: "acc_" + a.key + "_" + Math.random().toString(36).slice(2, 5), name: a.name, type: a.type, emoji: a.emoji, color: a.color, order: i, inTotal: true, initial: r2(a.type === "carte" || a.type === "pret" ? -Math.abs(v) : a.neg ? -Math.abs(v) : v)};
      a._id = d.id; docs.push(d);
    });
    for (const d of docs) if (d.k === "acc") { const a = accs.find(x => x._id === d.id);

      if (a.type === "pret") d.loan = {payment: calc(a.loan.payment) || 0, rate: calc(a.loan.rate) || 0, ins: calc(a.loan.ins) || 0, from: accs.find(x => x.key === a.loan.from)?._id, first: `${ym(start)}-${pad(Number(a.loan.day) || 5)}`};
    }
    const setDoc = docs.shift();
    setBusy([0, docs.length + 1]);
    await Store.bulk(docs.map(d => ["put", d]), (i, n) => setBusy([i, n + 1]));
    await Store.put(setDoc);
  };
  const others = accs.filter(a => a.type === "courant" || a.type === "especes");
  return html`<div class="ob">

      <h1>Bienvenue dans Pécule</h1>

      <button class="btn pri" onClick=${() => setStep(1)}>Valider et continuer</button>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:6px"><b>Tu utilises iCompta ?</b><span class="muted" style="font-size:14px;line-height:1.45">Reprends directement tes comptes, tes opérations en cours, ton échéancier, tes catégories et tes budgets.</span><button class="btn" onClick=${() => setImp(true)}>Importer depuis iCompta</button></div>

            toast("Sauvegarde restaurée : " + docs.length + " éléments"); } catch { setBusy(null); toast("Ce fichier n'est pas une sauvegarde Pécule"); } }} /></label></div>

    ${stepN === 1 && html`

          <${Field} label="Taux (%)" id=${"ob-lr" + i}><input id=${"ob-lr" + i} inputmode="decimal" value=${a.loan?.rate} onInput=${e => updL(i, "rate", e.target.value)} /></${Field}>
          <${Field} label="Prélevée le" id=${"ob-ld" + i}><input id=${"ob-ld" + i} type="number" value=${a.loan?.day} onInput=${e => updL(i, "day", e.target.value)} /></${Field}>
          <${Field} label="Sur" id=${"ob-lf" + i}><select id=${"ob-lf" + i} value=${a.loan?.from} onChange=${e => updL(i, "from", e.target.value)}>${others.map(o => html`<option value=${o.key}>${o.name}</option>`)}</select></${Field}>
          <${Field} label="Dont assurance / mois" id=${"ob-li" + i}><input id=${"ob-li" + i} inputmode="decimal" placeholder="0,00" value=${a.loan?.ins} onInput=${e => updL(i, "ins", e.target.value)} /></${Field}>
        </div>`}
      </div>`)}
      <button class="btn" onClick=${() => setAccs([...accs, {key: "n" + Date.now().toString(36), name: "Nouveau compte", type: "courant", emoji: "💳", color: COLORS[accs.length % COLORS.length], bal: "", neg: false}])}>+ Ajouter un compte</button>
      ${missing.length > 0 && html`<div class="help">Il manque le solde de : ${missing.map(a => a.name).join(", ")}.</div>`}
      <div class="btns"><button class="btn" onClick=${() => setStep(0)}>Retour</button><button class="btn pri" disabled=${missing.length > 0} onClick=${() => setStep(2)}>Valider les comptes</button></div>`}

      <div class="btns"><button class="btn" onClick=${() => setStep(1)}>Retour</button><button class="btn pri" onClick=${() => setStep(3)}>Valider les catégories</button></div>`}
    ${stepN === 3 && html`

  </div>`;

function UndoBar() {

  </main>`;

function ToastHost() {

function App() {
